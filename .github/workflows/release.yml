name: Release

# Manual only. This workflow cannot be triggered by a push, a tag, a pull
# request, or a schedule: publication is a human decision, taken once, on a
# commit that has already passed CI.
#
# It is inert until all of the following exist:
#   - the `npm-publish` environment in this repository, with required reviewers;
#   - a trusted publisher configured on npmjs.com for @agent-manifest/cli,
#     pointing at this repository, this workflow file and that environment;
#   - an explicit `confirm: publish` input at dispatch time;
#   - the sha-256 of the approved tarball, typed at dispatch time.
#
# Authentication is OpenID Connect (npm trusted publishing). There is no npm
# token in this repository and none is read here. Provenance is attested by npm
# from the OIDC claim, so the published package is traceable to this commit.
#
# The workflow publishes the exact tarball it built, after checking that its
# sha-256 equals the value approved by hand. If the build is not reproducible,
# it stops rather than publish an artefact nobody reviewed.
#
# It does not create tags, releases, or commits. Those are made by hand
# beforehand, and the tag is what this workflow is dispatched against.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm. Anything else aborts.'
        required: true
        default: 'no'
      sha256:
        description: 'sha-256 of the approved tarball. A mismatch aborts.'
        required: true
      tag:
        description: 'npm dist-tag to publish under.'
        required: true
        default: 'latest'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing and provenance
    steps:
      - name: Refuse an unconfirmed dispatch
        if: ${{ inputs.confirm != 'publish' }}
        run: |
          echo "Dispatch not confirmed; nothing published."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm 11.5.1 or later.
      - name: Use an npm release that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Verify before publishing
        run: |
          npm test
          node scripts/check-schema-parity.js

      - name: Check that the tag matches the version being published
        run: |
          version=$(npm pkg get version | tr -d '"')
          ref="${GITHUB_REF#refs/tags/}"
          if [ "$GITHUB_REF" != "$ref" ] && [ "$ref" != "v$version" ]; then
            echo "Dispatched against $ref but the package version is $version."
            exit 1
          fi

      - name: Build the tarball and check it against the approved checksum
        id: pack
        run: |
          file=$(npm pack --silent)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Contents:"
          tar -tzf "$file" | sort
          actual=$(sha256sum "$file" | cut -d' ' -f1)
          echo "approved: ${{ inputs.sha256 }}"
          echo "built:    $actual"
          if [ "$actual" != "${{ inputs.sha256 }}" ]; then
            echo "The tarball does not match the approved checksum; nothing published."
            exit 1
          fi

      - name: Publish the approved tarball
        run: npm publish "${{ steps.pack.outputs.file }}" --provenance --tag "${{ inputs.tag }}"

      - name: Verify the published package installs and runs
        run: |
          version=$(npm pkg get version | tr -d '"')
          cd "$(mktemp -d)"
          npm install -g "@agent-manifest/cli@$version"
          agent-manifest --version
          agent-manifest --help
