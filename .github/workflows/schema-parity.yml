name: Schema parity

# Agent Manifest v1.0 is frozen. This job compares the schema distributed by
# @agent-manifest/schema with the canonical published copy and fails if they
# diverge. It is read-only: drift is reported, not repaired.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-schema-parity.js'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The schema is a dependency now, so it has to be installed before it can
      # be compared with anything.
      - run: npm ci
      - run: node scripts/check-schema-parity.js
